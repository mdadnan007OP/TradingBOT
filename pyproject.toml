[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-trading-bot"
version = "0.3.0"
description = "Phase 3 MT5 integration for a modular automated Forex trading bot (PU Prime Demo connectivity)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Adnan" }]
license = { text = "MIT" }
keywords = ["forex", "trading", "bot", "mt5", "quantitative"]
dependencies = [
    # IANA timezone database for MQL5 server-tz -> UTC conversion.
    # Required on Windows (Linux/macOS provide system tz data).
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
mt5 = [
    "MetaTrader5>=5.0.45",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]